<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Blender Tutorial with Custom 3D Models</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io"></script>
    <style>
      #start-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(26, 37, 47, 0.95); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; font-family: sans-serif; text-align: center; cursor: pointer;
      }
      .play-btn {
        background: #2ecc71; border: none; padding: 15px 40px;
        font-size: 20px; font-weight: bold; color: white; border-radius: 30px; margin-top: 15px;
      }
      .button-container {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 10; display: flex; gap: 10px;
      }
      .btn {
        background: #2c3e50; color: white; border: 2px solid #34495e;
        padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="start-overlay" onclick="startExperience()">
      <h2>Blender Bevel 3D Tutorial</h2>
      <p>Tap anywhere to load the 3D models, video, and audio commentary!</p>
      <button class="play-btn">START</button>
    </div>

    <div class="button-container">
      <button class="btn" onclick="changeBevel('none')">No Bevel</button>
      <button class="btn" onclick="changeBevel('low')">Low Bevel</button>
      <button class="btn" onclick="changeBevel('high')">High Bevel</button>
    </div>

    <a-scene>
      <a-assets>
        <video id="blender-video" preload="none" loop playsinline webkit-playsinline src="tutorial.mp4"></video>
        
        <!-- PRELOAD YOUR BLENDER GLB MODELS HERE -->
        <a-asset-item id="model-none" src="cube_none.glb"></a-asset-item>
        <a-asset-item id="model-low" src="cube_low.glb"></a-asset-item>
        <a-asset-item id="model-high" src="cube_high.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#1a252f"></a-sky>
      
      

      <!-- Video Display Canvas -->
      <a-video id="video-display" src="#blender-video" width="3" height="1.7" position="0 1.5 -3"></a-video>

      <!-- Target Dynamic Object Container (Loads None model by default) -->
      <!-- Scale attribute adjusts size. Modify scale if your Blender model is too big/small -->
      

      
    </a-scene>

    <script>
      function startExperience() {
        document.getElementById('start-overlay').style.display = 'none';
        var video = document.querySelector('#blender-video');
        video.load();
        
        setTimeout(function() {
          video.play();
          var videoDisplay = document.querySelector('#video-display');
          if (videoDisplay && videoDisplay.components.material) {
             videoDisplay.components.material.material.map.image.play();
          }
        }, 150);
      }

      function changeBevel(type) {
        var meshContainer = document.querySelector('#target-mesh');
        
        // Dynamically change the gltf-model attribute to swap Blender files
        if (type === 'none') {
          meshContainer.setAttribute('gltf-model', '#model-none');
        } else if (type === 'low') {
          meshContainer.setAttribute('gltf-model', '#model-low');
        } else if (type === 'high') {
          meshContainer.setAttribute('gltf-model', '#model-high');
        }
      }
    </script>
  </body>
</html>
