<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <!-- IMPORTANT FOR ANDROID + iOS -->
  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>Blender Bevel Tutorial - Interactive 3D</title>

  <meta
    name="description"
    content="Interactive Blender Bevel Tutorial with 3D Blender models"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>


  <style>

    /* ==========================================
       FULL SCREEN MOBILE PAGE
    ========================================== */

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111c24;

      /* Prevent mobile browser selection */
      user-select: none;
      -webkit-user-select: none;

      /* Prevent scrolling */
      touch-action: none;

      /* iPhone safe areas */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);

    }


    /* ==========================================
       A-FRAME FULL SCREEN
    ========================================== */

    a-scene {

      width: 100%;
      height: 100%;

    }


    /* ==========================================
       INSTRUCTION
    ========================================== */

    .instruction-overlay {

      position: fixed;

      top: calc(
        15px + env(safe-area-inset-top)
      );

      left: 50%;

      transform: translateX(-50%);

      width: max-content;
      max-width: 85%;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      padding: 9px 15px;

      border-radius: 20px;

      font-family: Arial, sans-serif;

      font-size: 13px;

      text-align: center;

      z-index: 9999;

      pointer-events: none;

    }


    /* ==========================================
       BUTTON CONTAINER
    ========================================== */

    .ui-container {

      position: fixed;

      bottom: calc(
        20px + env(safe-area-inset-bottom)
      );

      left: 50%;

      transform: translateX(-50%);

      display: flex;

      gap: 8px;

      width: 95%;

      max-width: 500px;

      justify-content: center;

      z-index: 9999;

    }


    /* ==========================================
       BUTTONS
    ========================================== */

    .btn {

      flex: 1;

      min-height: 50px;

      background: #2c3e50;

      color: white;

      border: 2px solid #34495e;

      padding: 10px 8px;

      font-size: 13px;

      font-weight: bold;

      border-radius: 10px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.3);

      transition:
        transform 0.1s,
        background 0.2s;

    }


    /* Touch feedback */

    .btn:active {

      transform: scale(0.95);

      background: #16a085;

    }


    /* Disabled while loading */

    .btn.loading {

      opacity: 0.5;

      pointer-events: none;

    }


    /* ==========================================
       LOADING MESSAGE
    ========================================== */

    #model-loading {

      position: fixed;

      top: 50%;

      left: 50%;

      transform: translate(
        -50%,
        -50%
      );

      z-index: 10000;

      background: rgba(0, 0, 0, 0.85);

      color: white;

      padding: 15px 25px;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      font-size: 15px;

      text-align: center;

      display: none;

    }


    /* ==========================================
       SMALL PHONES
    ========================================== */

    @media (max-width: 380px) {

      .btn {

        font-size: 11px;

        padding: 8px 5px;

      }

      .instruction-overlay {

        font-size: 11px;

      }

    }


    /* ==========================================
       LANDSCAPE MODE
    ========================================== */

    @media (orientation: landscape) {

      .ui-container {

        bottom: 15px;

        max-width: 450px;

      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       INSTRUCTION
  ========================================== -->

  <div
    id="instruction"
    class="instruction-overlay"
  >

    Tap the screen to play the video.
    Swipe to look around.

  </div>


  <!-- ==========================================
       LOADING
  ========================================== -->

  <div id="model-loading">

    Loading 3D model...

  </div>


  <!-- ==========================================
       BUTTONS
  ========================================== -->

  <div class="ui-container">

    <button
      id="btn-none"
      class="btn"
      type="button"
      onclick="setBevel('none')"
    >

      No Bevel

    </button>


    <button
      id="btn-low"
      class="btn"
      type="button"
      onclick="setBevel('low')"
    >

      Low Bevel

    </button>


    <button
      id="btn-high"
      class="btn"
      type="button"
      onclick="setBevel('high')"
    >

      High Bevel

    </button>

  </div>



  <!-- ==========================================
       A-FRAME SCENE
  ========================================== -->

  <a-scene
    renderer="
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: false;
    "

    device-orientation-permission-ui="
      enabled: true;
    "

    vr-mode-ui="
      enabled: false;
    "

    loading-screen="
      enabled: false;
    "
  >


    <!-- ========================================
         ASSETS
    ========================================= -->

    <a-assets>

      <!-- VIDEO -->

      <video
        id="blender-video"

        preload="auto"

        loop

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

        src="Bevel Tool - Blender.mp4"
      >
      </video>


      <!-- ======================================
           BLENDER MODELS
      ======================================= -->

      <a-asset-item
        id="model-none"
        src="no bevel.glb"
      >
      </a-asset-item>


      <a-asset-item
        id="model-low"
        src="low bevel.glb"
      >
      </a-asset-item>


      <a-asset-item
        id="model-high"
        src="high bevel.glb"
      >
      </a-asset-item>

    </a-assets>



    <!-- ========================================
         FLOOR GRID
    ========================================= -->

    <a-grid

      position="0 0 0"

      geometry="
        primitive: plane;
        width: 100;
        height: 100;
      "

      rotation="-90 0 0"

      material="
        src: url(https://cdn.aframe.io/a-grid/grid.png);
        repeat: 100 100;
      "

    >
    </a-grid>



    <!-- ========================================
         SKY
    ========================================= -->

    <a-sky
      color="#111c24"
    >
    </a-sky>



    <!-- ========================================
         LIGHTING
    ========================================= -->

    <a-entity
      light="
        type: ambient;
        color: #777;
        intensity: 1;
      "
    >
    </a-entity>


    <a-entity

      light="
        type: directional;
        color: #fff;
        intensity: 0.9;
      "

      position="-2 3 2"

    >
    </a-entity>



    <!-- ========================================
         LEFT SIDE
         BEFORE / SHARP
    ========================================= -->

    <a-entity

      position="-2.8 1.5 -3"

      rotation="15 45 0"

    >

      <a-box

        width="1"

        height="1"

        depth="1"

        color="#e74c3c"

        material="
          roughness: 0.4;
        "

      >
      </a-box>


      <a-text

        value="Before&#10;(Sharp)"

        align="center"

        position="0 -0.8 0"

        width="3"

        color="#fff"

      >
      </a-text>

    </a-entity>



    <!-- ========================================
         CENTER VIDEO
    ========================================= -->

    <a-video

      id="tutorial-video"

      src="#blender-video"

      width="3"

      height="1.7"

      position="0 1.5 -3"

      rotation="0 0 0"

    >

      <a-text

        value="Blender Tutorial: How to Bevel"

        align="center"

        position="0 1.1 0"

        width="4"

        color="#fff"

      >
      </a-text>


      <a-text

        id="step-text"

        value="Interactive: Try the buttons below!"

        align="center"

        position="0 -1.1 0"

        width="3.5"

        color="#f1c40f"

      >
      </a-text>

    </a-video>



    <!-- ========================================
         RIGHT SIDE
         BLENDER MODEL
    ========================================= -->

    <a-entity

      id="interactive-target"

      position="2.8 1.5 -3"

      rotation="15 45 0"

    >


      <!-- MODEL -->

      <a-entity

        id="cube-mesh"

        gltf-model="#model-none"

        scale="1 1 1"

      >
      </a-entity>


      <!-- LABEL -->

      <a-text

        id="label-text"

        value="Interactive Model&#10;(No Bevel)"

        align="center"

        position="0 -0.8 0"

        width="3"

        color="#fff"

      >
      </a-text>

    </a-entity>



    <!-- ========================================
         CAMERA
    ========================================= -->

    <a-entity

      id="camera"

      camera

      look-controls="
        touchEnabled: true;
        magicWindowTrackingEnabled: true;
      "

      wasd-controls="enabled: false"

      position="0 1.6 0"

    >
    </a-entity>


  </a-scene>



  <!-- ==========================================
       JAVASCRIPT
  ========================================== -->

  <script>


    /* ==========================================
       MODEL DATA
    ========================================== */

    const models = {

      none: {

        asset: '#model-none',

        label:
          'Interactive Model\n(No Bevel)',

        step:
          'Step 1: Raw geometry selected.'

      },


      low: {

        asset: '#model-low',

        label:
          'Interactive Model\n(Low Bevel)',

        step:
          'Step 2: Ctrl + B applied (1 Segment).'

      },


      high: {

        asset: '#model-high',

        label:
          'Interactive Model\n(High Bevel)',

        step:
          'Step 3: Multiple Bevel Segments.'

      }

    };


    /* ==========================================
       VARIABLES
    ========================================== */

    let currentModel = 'none';

    let isLoading = false;


    /* ==========================================
       ELEMENTS
    ========================================== */

    const modelContainer =
      document.querySelector('#cube-mesh');

    const labelText =
      document.querySelector('#label-text');

    const stepText =
      document.querySelector('#step-text');

    const loadingMessage =
      document.querySelector('#model-loading');

    const buttons =
      document.querySelectorAll('.btn');


    /* ==========================================
       BUTTON CONTROL
    ========================================== */

    function setButtonsDisabled(disabled) {

      buttons.forEach(
        function(button) {

          button.disabled = disabled;

          if (disabled) {

            button.classList.add(
              'loading'
            );

          }

          else {

            button.classList.remove(
              'loading'
            );

          }

        }
      );

    }


    /* ==========================================
       SHOW LOADING
    ========================================== */

    function showLoading() {

      loadingMessage.style.display =
        'block';

      loadingMessage.textContent =
        'Loading 3D model...';

      setButtonsDisabled(true);

    }


    /* ==========================================
       HIDE LOADING
    ========================================== */

    function hideLoading() {

      loadingMessage.style.display =
        'none';

      setButtonsDisabled(false);

    }


    /* ==========================================
       SWITCH MODEL
    ========================================== */

    function setBevel(type) {

      if (!models[type]) {

        console.error(
          'Invalid model:',
          type
        );

        return;

      }


      if (type === currentModel) {

        return;

      }


      if (isLoading) {

        return;

      }


      isLoading = true;

      showLoading();


      const selected =
        models[type];


      /*
       * Remove the previous GLB.
       */

      modelContainer.removeAttribute(
        'gltf-model'
      );


      /*
       * Give the browser a frame to
       * remove the previous model.
       */

      requestAnimationFrame(
        function() {

          modelContainer.setAttribute(
            'gltf-model',
            selected.asset
          );


          /*
           * MODEL LOADED
           */

          const onLoaded =
            function() {

              modelContainer.removeEventListener(
                'model-loaded',
                onLoaded
              );


              modelContainer.removeEventListener(
                'model-error',
                onError
              );


              currentModel = type;

              isLoading = false;


              labelText.setAttribute(
                'value',
                selected.label
              );


              stepText.setAttribute(
                'value',
                selected.step
              );


              hideLoading();


              console.log(
                'Loaded:',
                type
              );

            };


          /*
           * MODEL ERROR
           */

          const onError =
            function(error) {

              modelContainer.removeEventListener(
                'model-loaded',
                onLoaded
              );


              modelContainer.removeEventListener(
                'model-error',
                onError
              );


              isLoading = false;

              hideLoading();


              alert(
                'Unable to load the 3D model. ' +
                'Please check your internet connection ' +
                'and GLB file.'
              );


              console.error(
                'GLB error:',
                error
              );

            };


          modelContainer.addEventListener(
            'model-loaded',
            onLoaded
          );


          modelContainer.addEventListener(
            'model-error',
            onError
          );

        }
      );

    }



    /* ==========================================
       A-FRAME LOADED
    ========================================== */

    const scene =
      document.querySelector('a-scene');


    scene.addEventListener(
      'loaded',
      function() {

        console.log(
          'A-Frame loaded.'
        );


        /*
         * Load the initial model.
         */

        modelContainer.setAttribute(
          'gltf-model',
          '#model-none'
        );


      }
    );



    /* ==========================================
       MOBILE VIDEO
    ========================================== */

    const video =
      document.querySelector(
        '#blender-video'
      );


    /*
     * iOS and Android browsers generally
     * require video playback to begin from
     * a user gesture.
     */

    document.addEventListener(
      'touchstart',
      function startVideo() {

        if (
          video &&
          video.paused
        ) {

          video.play().catch(
            function(error) {

              console.log(
                'Video waiting for user interaction.',
                error
              );

            }
          );

        }


        /*
         * Only need the first gesture.
         */

        document.removeEventListener(
          'touchstart',
          startVideo
        );

      },
      {
        passive: true,
        once: true
      }
    );


    /*
     * Also support desktop mouse.
     */

    document.addEventListener(
      'click',
      function() {

        if (
          video &&
          video.paused
        ) {

          video.play().catch(
            function(error) {

              console.log(
                'Video waiting for user interaction.',
                error
              );

            }
          );

        }

      }
    );



    /* ==========================================
       iOS DEVICE ORIENTATION
    ========================================== */

    /*
     * Newer iOS versions can require
     * permission before accessing the
     * gyroscope/orientation sensors.
     */

    async function requestMotionPermission() {

      try {

        if (
          typeof DeviceOrientationEvent !==
          'undefined' &&

          typeof DeviceOrientationEvent
            .requestPermission ===
            'function'
        ) {

          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission === 'granted'
          ) {

            console.log(
              'Motion permission granted.'
            );

          }

        }

      }

      catch (error) {

        console.log(
          'Motion permission not available:',
          error
        );

      }

    }


    /*
     * Ask for motion permission after
     * the user touches the screen.
     */

    document.addEventListener(
      'touchend',
      function() {

        requestMotionPermission();

      },
      {
        once: true
      }
    );

  </script>

</body>

</html>
